
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>James' Nerf Squad</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!-- WCAG 2.4.1 Bypass Blocks / 1.3.1 Info and Relationships: a single main
     landmark wraps the whole game so landmark navigation (VoiceOver VO+U,
     JAWS R key) has a structure to jump to, even though this page has only
     one visible region. -->
<main>
<canvas id="gameCanvas" role="img" aria-label="James' Nerf Squad game area"></canvas>
<!-- WCAG 1.3.1 / 4.1.3: visually hidden live region for screen-reader announcements -->
<div id="game-announcer" aria-live="polite" aria-atomic="false"
     style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px"></div>
</main>
<script>
// Inline a tiny error catcher so black-screen failures are visible
window.addEventListener('error', function(e) {
  var c = document.getElementById('gameCanvas');
  if (!c) return;
  var ctx = c.getContext('2d');
  c.width = 480; c.height = 270;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,480,270);
  ctx.fillStyle = '#f00'; ctx.font = '10px monospace';
  ctx.fillText('ERROR: ' + e.message, 8, 20);
  ctx.fillText('File: ' + (e.filename||'').split('/').pop() + ' line ' + e.lineno, 8, 36);
});
</script>
<!-- Load modules in strict dependency order -->
<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/input.js"></script>
<script src="js/sound.js"></script>
<script src="js/music.js"></script>
<script src="js/particles.js"></script>
<script src="js/icons.js"></script>
<script src="js/player.js"></script>
<script src="js/enemy.js"></script>
<script src="js/boss.js"></script>
<script src="js/hud.js"></script>
<script src="js/screens.js"></script>
<script src="js/touch.js"></script>
<script src="js/speech.js"></script>
<script src="js/announcer.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
